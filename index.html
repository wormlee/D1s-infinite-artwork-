<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>INFINITE DREAM — Two World Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030106;color:#fff;font-family:system-ui,sans-serif;touch-action:none}
#stage{position:fixed;inset:0;perspective:900px;overflow:hidden;background:#000}
#world{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.scene{position:absolute;left:50%;top:50%;width:min(100vw,1000px);aspect-ratio:1000/700;
 transform:translate(-50%,-50%) translate3d(0,0,0) scale(1);
 transform-origin:center;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
.scene svg{width:100%;height:100%;display:block;filter:saturate(1.15)}
#hud{position:fixed;z-index:10;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#0009;border:1px solid #fff3;border-radius:14px;padding:8px 11px;font-size:11px;letter-spacing:2px;backdrop-filter:blur(8px)}
#hint{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);background:#0009;border:1px solid #fff2;border-radius:18px;padding:9px 13px;font-size:11px;letter-spacing:1px;white-space:nowrap;transition:opacity .5s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
</style></head><body>
<div id="stage"><div id="world">

 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>

</g>
<g fill="#9e183d" opacity=".65"><circle cx="210" cy="410" r="5"/><circle cx="400" cy="355" r="5"/></g>

<rect x="55" y="95" width="130" height="100" transform="rotate(-7 120 145)"/>
<rect x="300" y="70" width="110" height="85" transform="rotate(8 355 112)"/>

<g fill="#020105"><path d="M720 300 Q760 245 800 300 L825 500 Q770 535 700 500Z"/><ellipse cx="765" cy="270" rx="38" ry="50"/></g>
<g fill="#e72a52" filter="url(#glow)"><ellipse cx="750" cy="265" rx="6" ry="3"/><ellipse cx="780" cy="265" rx="6" ry="3"/></g>
<!-- floor symbols -->

<circle cx="500" cy="575" r="80"/><path d="M430 575h140M500 505v140M450 525l100 100M550 525L450 625"/>
</g>
<!-- hands -->
<g fill="#241522" stroke="#633a59" stroke-width="3" opacity=".9">
<path d="M410 570q-55-45-75 5q30-10 55 15q-10 35 20 25q30-20 15-50Z"/>
<path d="M590 570q55-45 75 5q-30-10-55 15q10 35-20 25q-30-20-15-50Z"/>
</g>
<!-- portal doors -->

    <g class="portal" data-target="psy" data-x="500" data-y="345" tabindex="0"
       transform="translate(500 345)">
      <ellipse rx="135" ry="105" fill="#09020f" stroke="#d72f78" stroke-width="10"/>
      <ellipse rx="122" ry="92" fill="none" stroke="#d72f78" stroke-width="3" opacity=".8"/>
      <ellipse rx="108" ry="78" fill="none" stroke="#fff" stroke-width="1.5" opacity=".55"/>
      <path d="M-115 0 Q 0 -68.25 115 0 Q 0 68.25 -115 0Z"
            fill="none" stroke="#d72f78" stroke-width="2" opacity=".7"/>
      <circle r="5" fill="#fff"/>
    </g>

    <g class="portal" data-target="psy" data-x="165" data-y="405" tabindex="0"
       transform="translate(165 405)">
      <ellipse rx="70" ry="95" fill="#09020f" stroke="#6e35ff" stroke-width="10"/>
      <ellipse rx="57" ry="82" fill="none" stroke="#6e35ff" stroke-width="3" opacity=".8"/>
      <ellipse rx="43" ry="68" fill="none" stroke="#fff" stroke-width="1.5" opacity=".55"/>
      <path d="M-50 0 Q 0 -61.75 50 0 Q 0 61.75 -50 0Z"
            fill="none" stroke="#6e35ff" stroke-width="2" opacity=".7"/>
      <circle r="5" fill="#fff"/>

    <g class="portal" data-target="psy" data-x="905" data-y="350" tabindex="0"
       transform="translate(905 350)">
      <ellipse rx="62" ry="100" fill="#09020f" stroke="#21d7b5" stroke-width="10"/>
      <ellipse rx="49" ry="87" fill="none" stroke="#21d7b5" stroke-width="3" opacity=".8"/>
      <ellipse rx="35" ry="73" fill="none" stroke="#fff" stroke-width="1.5" opacity=".55"/>
      <path d="M-42 0 Q 0 -65.0 42 0 Q 0 65.0 -42 0Z"
            fill="none" stroke="#21d7b5" stroke-width="2" opacity=".7"/>
      <circle r="5" fill="#fff"/>
    </g>
<text x="500" y="355" text-anchor="middle" fill="#fff" font-family="serif" font-size="25" letter-spacing="7">DO NOT LOOK BACK</text>
</svg></section>
<section class="scene" id="s1"><svg viewBox="0 0 1000 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
<defs>
 <radialGradient id="pg"><stop stop-color="#ffe36e"/><stop offset=".25" stop-color="#ff4fc8"/><stop offset=".55" stop-color="#612cff"/><stop offset="1" stop-color="#050015"/></radialGradient>
 <linearGradient id="rain" x2="1" y2="1"><stop stop-color="#16e0c0"/><stop offset=".4" stop-color="#9b3cff"/><stop offset=".7" stop-color="#ff4db8"/><stop offset="1" stop-color="#ffe45e"/></linearGradient>
 <filter id="pglo"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="700" fill="#090018"/>
<rect width="1000" height="700" fill="url(#pg)" opacity=".9"/>
<!-- fractal waves -->
<g fill="none" stroke="url(#rain)" stroke-width="5" opacity=".8">
<path d="M0 70 Q 250 20 500 350 T1000 80"/><path d="M0 105 Q 250 38 500 346 T1000 110"/><path d="M0 140 Q 250 56 500 342 T1000 140"/><path d="M0 175 Q 250 74 500 338 T1000 170"/><path d="M0 210 Q 250 92 500 334 T1000 200"/><path d="M0 245 Q 250 110 500 330 T1000 230"/><path d="M0 280 Q 250 128 500 326 T1000 260"/><path d="M0 315 Q 250 146 500 322 T1000 290"/><path d="M0 350 Q 250 164 500 318 T1000 320"/><path d="M0 385 Q 250 182 500 314 T1000 350"/><path d="M0 420 Q 250 200 500 310 T1000 380"/><path d="M0 455 Q 250 218 500 306 T1000 410"/><path d="M0 490 Q 250 236 500 302 T1000 440"/><path d="M0 525 Q 250 254 500 298 T1000 470"/><path d="M0 560 Q 250 272 500 294 T1000 500"/><path d="M0 595 Q 250 290 500 290 T1000 530"/><path d="M0 630 Q 250 308 500 286 T1000 560"/>
</g>
<!-- giant eye -->
<path d="M120 350 Q500 70 880 350 Q500 630 120 350Z" fill="#12082d" stroke="#fff" stroke-width="6"/>
<ellipse cx="500" cy="350" rx="135" ry="180" fill="url(#rain)" opacity=".85"/>
<ellipse cx="500" cy="350" rx="60" ry="95" fill="#090015"/>
<circle cx="480" cy="320" r="18" fill="#fff"/>
<!-- mushroom city -->
<g stroke="#1c0b38" stroke-width="4">
<path d="M90 600Q150 500 210 600Z" fill="#ff315f"/><path d="M150 600v80" stroke="#e5b7ff" stroke-width="22"/>
<path d="M235 610Q315 455 395 610Z" fill="#7c4dff"/><path d="M315 610v80" stroke="#ffd3f4" stroke-width="25"/>
<path d="M625 610Q700 470 775 610Z" fill="#24e3c4"/><path d="M700 610v80" stroke="#c9fff3" stroke-width="25"/>
<path d="M800 600Q860 500 920 600Z" fill="#ffcc42"/><path d="M860 600v80" stroke="#fff1bc" stroke-width="20"/>
</g>
<!-- tiny elves -->
<g fill="#ffe4a8" stroke="#180827" stroke-width="3">
<circle cx="210" cy="535" r="14"/><circle cx="270" cy="555" r="13"/><circle cx="735" cy="540" r="14"/><circle cx="790" cy="555" r="12"/>
</g>
<g stroke="#ffef63" stroke-width="5" filter="url(#pglo)"><path d="M210 550l-20 45M210 550l25 40M270 568l-25 35M270 568l25 35M735 553l-25 38M735 553l25 38M790 568l-22 35M790 568l25 30"/></g>
<!-- mirror fragments -->
<g fill="#9bf7ff" opacity=".25" stroke="#fff" stroke-width="3">
<path d="M35 45L160 15L135 145L55 180Z"/><path d="M850 35L980 80L930 185L845 125Z"/>
<path d="M30 470L130 420L180 520L75 565Z"/>
</g>
<!-- central portal -->
{portal(500,350,155,125,"#fff06a","future")}
<text x="500" y="350" text-anchor="middle" fill="#16001e" font-family="serif" font-size="27" font-weight="bold" letter-spacing="8">ONE THING</text>
<text x="500" y="382" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="16" letter-spacing="4">BECOMES ANOTHER</text>
</svg></section>
</div></div>
<div id="hud"><div class="badge" id="title">WORLD 01 · HORROR</div><div class="badge">SWIPE / PINCH / DIVE</div></div>
<div id="hint">Swipe to steer • pinch or use two fingers to dive • tap a portal</div><div id="flash"></div>
<script>
const scenes=[document.getElementById('s0'),document.getElementById('s1')];
let depth=0, panX=0, panY=0, targetDepth=0, targetX=0, targetY=0, dragging=false, lastX=0,lastY=0, pinchStart=0, depthStart=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){
 const z=depth*900;
 scenes.forEach((s,i)=>{
   const dz=i*900-z;
   const scale=Math.max(.05,900/(900-dz));
   const op=clamp(1-Math.abs(dz)/1600,.05,1);
   s.style.transform=`translate(-50%,-50%) translate3d(${panX*(scale)}px,${panY*(scale)}px,${dz}px) scale(${scale})`;
   s.style.opacity=op;
 });
 document.getElementById('title').textContent=depth<.5?'WORLD 01 · HORROR':'WORLD 02 · PSYCHEDELIC';
}
function frame(){
 depth+=(targetDepth-depth)*.12; panX+=(targetX-panX)*.12; panY+=(targetY-panY)*.12; render(); requestAnimationFrame(frame);
}
function dive(amount=.9){targetDepth=clamp(targetDepth+amount,0,1.08);}
function flash(){const f=document.getElementById('flash');f.style.opacity=.7;setTimeout(()=>f.style.opacity=0,180)}
document.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
document.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;targetX=clamp(targetX+dx*1.3,-240,240);targetY=clamp(targetY+dy*1.3,-180,180);});
document.addEventListener('pointerup',()=>dragging=false);
document.addEventListener('wheel',e=>{e.preventDefault();dive(e.deltaY>0?.035:-.035)},{passive:false});
document.addEventListener('touchstart',e=>{
 if(e.touches.length===2){pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);depthStart=targetDepth;}
},{passive:false});
document.addEventListener('touchmove',e=>{
 if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);targetDepth=clamp(depthStart+(pinchStart-d)/600,0,1.08);}
},{passive:false});
document.querySelectorAll('.portal').forEach(p=>p.addEventListener('pointerup',e=>{e.stopPropagation();flash();targetDepth=clamp(targetDepth+.75,0,1.08);}));
setTimeout(()=>document.getElementById('hint').style.opacity=.25,5000);
render();frame();
</script></body></html>
