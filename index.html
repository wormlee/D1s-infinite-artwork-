<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>INFINITE — 50 Dream Worlds</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020107;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:20}
#name{position:absolute;top:15px;left:16px;font-size:12px;font-weight:900;letter-spacing:.14em;text-shadow:0 2px 15px #000;max-width:72vw}
#sub{position:absolute;top:36px;left:16px;font-size:9px;opacity:.55;letter-spacing:.12em}
#buttons{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:7px;pointer-events:auto;padding:0 8px}
button{border:1px solid rgba(255,255,255,.3);background:rgba(5,4,14,.72);backdrop-filter:blur(12px);color:#fff;border-radius:30px;padding:13px 12px;min-width:70px;font-size:10px;font-weight:900;letter-spacing:.05em}
button:active{transform:scale(.94)}
#credit{position:absolute;right:15px;top:15px;text-align:right;font-size:9px;opacity:.4;line-height:1.5}
</style></head><body>
<canvas id="c"></canvas><div id="ui">
<div id="name"></div><div id="sub">50 WORLDS • DRAG • PINCH • DIVE</div>
<div id="credit">INFINITE<br>DREAM DESCENT</div>
<div id="buttons"><button id="out">− ZOOM</button><button id="dive">DIVE</button><button id="pause">PAUSE</button><button id="in">+ ZOOM</button></div>
</div>
<script>
const C=document.getElementById("c"),X=C.getContext("2d"),N=document.getElementById("name");
const scenes=[('THE DOOR THAT REMEMBERS', 'door', 'violet'), ('SCHOOL OF STRANGE THINGS', 'school', 'blue'), ('THE EMPTY CLASSROOM', 'school', 'gold'), ('THE DESK WITH A HEART', 'desk', 'red'), ('LUNCH BECOMES A GALAXY', 'food', 'purple'), ('THE ROOM OF TOO MANY PLATES', 'food', 'cyan'), ('THE MIRROR HALL', 'mirror', 'silver'), ('CRACK IN THE MIRROR', 'crack', 'magenta'), ('THE OTHER SIDE OF GLASS', 'mirror', 'blue'), ('FOREST OF WATCHING EYES', 'forest', 'green'), ('MUSHROOM CITY', 'mushroom', 'pink'), ('THE LITTLE ELF PARTY', 'party', 'green'), ('BANQUET UNDER THE ROOTS', 'food', 'amber'), ('THE RED MOON CARNIVAL', 'carnival', 'red'), ('A HOUSE INSIDE A HOUSE', 'house', 'violet'), ('THE LIBRARY OF DREAMS', 'library', 'gold'), ('THE BOOK THAT READS YOU', 'book', 'blue'), ('STAIRCASE WITHOUT A FLOOR', 'stairs', 'cyan'), ('THE OCEAN IN A BEDROOM', 'ocean', 'blue'), ('THE SKY UNDER THE SEA', 'ocean', 'teal'), ('CITY BENEATH THE SKIN', 'city', 'red'), ('ONE THOUSAND WINDOWS', 'city', 'gold'), ('PEOPLE MADE OF STARS', 'stars', 'violet'), ('THE CLOCK WITH NO TIME', 'clock', 'silver'), ('GARDEN OF LOST THOUGHTS', 'garden', 'green'), ('THE GIANT EYE', 'eye', 'magenta'), ('THE EYE WITHIN THE EYE', 'eye', 'violet'), ('UNIVERSE IN A TEARDROP', 'tear', 'blue'), ('THE MOUNTAIN IS BREATHING', 'mountain', 'green'), ('THE ROOM AT THE END', 'room', 'red'), ('THE ROOM BEFORE THE BEGINNING', 'room', 'gold'), ('ALL THINGS ARE ONE', 'unity', 'white'), ('THE THREAD CONNECTS EVERYTHING', 'thread', 'cyan'), ('THE INFINITE DINNER TABLE', 'food', 'amber'), ('THE CHILD WHO FOUND THE DOOR', 'door', 'violet'), ('THE DOOR INSIDE THE DOOR', 'door', 'magenta'), ('THE COSMIC CLASSROOM', 'school', 'blue'), ('THE MUSHROOM SUN', 'mushroom', 'pink'), ('THE DREAMING CITY', 'city', 'purple'), ('THE CITY DREAMS OF YOU', 'city', 'cyan'), ('THE MIRROR DREAMS OF THE CITY', 'mirror', 'silver'), ('THE CRACK BECOMES A RIVER', 'crack', 'blue'), ('THE RIVER BECOMES A SKY', 'ocean', 'teal'), ('THE SKY BECOMES AN EYE', 'eye', 'violet'), ('THE EYE BECOMES A WORLD', 'eye', 'gold'), ('THE WORLD BECOMES A SEED', 'seed', 'green'), ('THE SEED CONTAINS EVERYTHING', 'seed', 'white'), ('LET GO', 'unity', 'violet'), ('YOU ARE HERE', 'unity', 'cyan'), ('THE DOOR REMEMBERS', 'door', 'magenta')];
let W,H,D,z=0,v=.0018,px=0,py=0,drag=0,lx=0,ly=0,pinch=0,paused=0;
function size(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0)}addEventListener("resize",size);size();
function R(n){return Math.abs(Math.sin(n*91.731+17.17)*43758.5453)%1}
function col(name,a){let m={violet:[190,75,255],blue:[80,170,255],gold:[255,195,65],red:[255,70,95],purple:[170,80,255],cyan:[55,235,255],silver:[205,220,255],magenta:[255,65,205],green:[75,255,150],pink:[255,90,190],amber:[255,150,55],teal:[40,240,190],white:[255,255,255]};let q=m[name]||m.violet;return`rgba(${q[0]},${q[1]},${q[2]},${a})`}
function glow(x,y,r,c,a){let g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col(c,a));g.addColorStop(1,col(c,0));X.fillStyle=g;X.beginPath();X.arc(x,y,r,0,7);X.fill()}
function poly(cx,cy,r,sides,rot,stroke){X.beginPath();for(let i=0;i<=sides;i++){let a=rot+i*Math.PI*2/sides;let q=i==sides?1:1;let xx=cx+Math.cos(a)*r*q,yy=cy+Math.sin(a)*r*q;i?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.strokeStyle=stroke;X.stroke()}
function eye(cx,cy,s,c){X.strokeStyle=col(c,.55);X.lineWidth=Math.max(1,s*.025);X.beginPath();X.ellipse(cx,cy,s*.55,s*.28,0,0,7);X.stroke();X.fillStyle=col(c,.75);X.beginPath();X.arc(cx,cy,s*.11,0,7);X.fill()}
function tree(x,y,s,c){X.strokeStyle=col(c,.45);X.lineWidth=Math.max(1,s*.035);X.beginPath();X.moveTo(x,y+s*.45);X.lineTo(x,y-s*.15);X.lineTo(x-s*.28,y-s*.38);X.moveTo(x,y);X.lineTo(x+s*.3,y-s*.34);X.stroke();glow(x,y-s*.3,s*.35,c,.14)}
function mushroom(x,y,s,c){X.fillStyle=col(c,.55);X.beginPath();X.arc(x,y,s*.36,Math.PI,0);X.fill();X.fillStyle="rgba(240,220,195,.75)";X.fillRect(x-s*.07,y-s*.05,s*.14,s*.4);for(let i=0;i<4;i++){X.fillStyle="#fff";X.globalAlpha=.55;X.beginPath();X.arc(x+(i-1.5)*s*.13,y-s*.18,s*.025,0,7);X.fill()}X.globalAlpha=1}
function windowBox(x,y,w,h,c){X.strokeStyle=col(c,.4);X.lineWidth=Math.max(1,w*.018);X.strokeRect(x-w/2,y-h/2,w,h);X.beginPath();X.moveTo(x,y-h/2);X.lineTo(x,y+h/2);X.moveTo(x-w/2,y);X.lineTo(x+w/2,y);X.stroke()}
function scene(type,c,depth,s){
 const cx=W/2+px,cy=H/2+py,r=Math.min(W,H)*.48*s;
 // perspective frame: every world is a stage with a real "room" feeling
 X.save();X.globalCompositeOperation="lighter";glow(cx,cy,r*1.2,c,.16);X.restore();
 X.strokeStyle=col(c,.25);X.lineWidth=1.5;
 // ceiling/floor perspective lines
 for(let k=0;k<8;k++){let a=(k/8)*Math.PI*2;let rr=r*(.72+R(depth*33+k)*.18);X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);X.stroke()}
 if(type==="school"){for(let i=-2;i<=2;i++)windowBox(cx+i*r*.27,cy-r*.42,r*.2,r*.22,c);for(let i=0;i<4;i++){X.fillStyle=col(c,.13);X.fillRect(cx-r*.5+i*r*.3,cy+r*.2,r*.2,r*.05)}}
 if(type==="desk"){X.strokeStyle=col(c,.5);X.lineWidth=3;X.beginPath();X.moveTo(cx-r*.42,cy+r*.18);X.lineTo(cx+r*.42,cy+r*.18);X.moveTo(cx-r*.3,cy+r*.18);X.lineTo(cx-r*.38,cy+r*.48);X.moveTo(cx+r*.3,cy+r*.18);X.lineTo(cx+r*.38,cy+r*.48);X.stroke();eye(cx,cy-r*.02,r*.16,c)}
 if(type==="food"){X.strokeStyle=col(c,.45);X.lineWidth=2;for(let q=1;q<5;q++){X.beginPath();X.ellipse(cx,cy,r*.65*q/5,r*.28*q/5,0,0,7);X.stroke()}for(let q=0;q<6;q++){let a=q*Math.PI/3;X.fillStyle=col(c,.4);X.beginPath();X.arc(cx+Math.cos(a)*r*.3,cy+Math.sin(a)*r*.16,r*.08,0,7);X.fill()}}
 if(type==="mirror"){X.strokeStyle=col(c,.6);X.lineWidth=4;X.strokeRect(cx-r*.48,cy-r*.62,r*.96,r*1.24);X.strokeStyle=col("white",.22);X.beginPath();X.moveTo(cx-r*.38,cy-r*.48);X.lineTo(cx+r*.36,cy+r*.46);X.moveTo(cx+r*.34,cy-r*.5);X.lineTo(cx-r*.36,cy+r*.48);X.stroke()}
 if(type==="crack"){X.strokeStyle=col(c,.8);X.lineWidth=Math.max(1,r*.018);for(let q=0;q<9;q++){let a=q*.73;X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(a)*r*.7,cy+Math.sin(a)*r*.7);X.stroke()}}
 if(type==="forest"){for(let q=0;q<9;q++){let a=q*.69;tree(cx+Math.cos(a)*r*.62,cy+Math.sin(a)*r*.45,r*.25,c)}}
 if(type==="mushroom"){for(let q=0;q<8;q++)mushroom(cx+(q-3.5)*r*.17,cy+Math.sin(q)*r*.2,r*(.12+.03*(q%3)),c)}
 if(type==="party"){for(let q=0;q<12;q++){let a=q*Math.PI/6;let xx=cx+Math.cos(a)*r*.42,yy=cy+Math.sin(a)*r*.3;X.fillStyle=col(c,.55);X.beginPath();X.arc(xx,yy,r*.045,0,7);X.fill();X.fillRect(xx-r*.025,yy+r*.04,r*.05,r*.14)}glow(cx,cy,r*.35,c,.2)}
 if(type==="city"){for(let q=0;q<10;q++){let xx=cx+(q-5)*r*.16;let hh=r*(.25+R(depth+q)*.5);windowBox(xx,cy+r*.15-hh/2,r*.11,hh,c)}}
 if(type==="library"||type==="book"){for(let q=-4;q<=4;q++){X.fillStyle=col(c,.25);X.fillRect(cx+q*r*.13,cy-r*.4,r*.09,r*.65)}windowBox(cx,cy+r*.08,r*.35,r*.45,c)}
 if(type==="stairs"){for(let q=0;q<8;q++){X.strokeStyle=col(c,.38);X.beginPath();X.moveTo(cx-r*.4+q*r*.08,cy+r*.42-q*r*.09);X.lineTo(cx+r*.4-q*r*.08,cy+r*.42-q*r*.09);X.stroke()}}
 if(type==="ocean"){for(let q=0;q<7;q++){X.strokeStyle=col(c,.35);X.beginPath();for(let j=0;j<80;j++){let xx=cx-r*.7+j*r*.0175,yy=cy+(q-.5)*r*.14+Math.sin(j*.35+q)*r*.025; j?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.stroke()}}
 if(type==="eye"){eye(cx,cy,r*.75,c);for(let q=0;q<7;q++)eye(cx+Math.cos(q)*r*.42,cy+Math.sin(q)*r*.3,r*.12,c)}
 if(type==="clock"){X.strokeStyle=col(c,.5);X.lineWidth=3;X.beginPath();X.arc(cx,cy,r*.45,0,7);X.stroke();for(let q=0;q<12;q++){let a=q*Math.PI/6;X.beginPath();X.moveTo(cx+Math.cos(a)*r*.36,cy+Math.sin(a)*r*.36);X.lineTo(cx+Math.cos(a)*r*.42,cy+Math.sin(a)*r*.42);X.stroke()}X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+r*.18,cy-r*.2);X.moveTo(cx,cy);X.lineTo(cx-r*.05,cy+r*.23);X.stroke()}
 if(type==="garden"){for(let q=0;q<14;q++)tree(cx+(R(q+depth)-.5)*r,cy+(R(q*7+depth)-.5)*r*.7,r*.13,c)}
 if(type==="tear"){X.strokeStyle=col(c,.6);X.beginPath();X.moveTo(cx,cy-r*.6);X.bezierCurveTo(cx+r*.5,cy-r*.1,cx+r*.35,cy+r*.5,cx,cy+r*.62);X.bezierCurveTo(cx-r*.35,cy+r*.5,cx-r*.5,cy-r*.1,cx,cy-r*.6);X.stroke()}
 if(type==="mountain"){X.strokeStyle=col(c,.4);X.beginPath();X.moveTo(cx-r*.7,cy+r*.35);X.lineTo(cx-r*.15,cy-r*.45);X.lineTo(cx+r*.15,cy-r*.1);X.lineTo(cx+r*.45,cy-r*.55);X.lineTo(cx+r*.7,cy+r*.35);X.stroke()}
 if(type==="unity"||type==="seed"){for(let q=0;q<12;q++){let a=q*Math.PI/6;let rr=r*(.18+.04*q);X.strokeStyle=col(c,.35);X.beginPath();X.arc(cx,cy,rr,a,a+Math.PI*1.3);X.stroke()}glow(cx,cy,r*.25,c,.35)}
 if(type==="thread"){X.strokeStyle=col(c,.7);X.lineWidth=2;X.beginPath();for(let q=0;q<80;q++){let xx=cx-r*.7+q*r*.0175,yy=cy+Math.sin(q*.22+depth)*r*.22; q?X.lineTo(xx,yy):X.moveTo(xx,yy)}X.stroke()}
 if(type==="door"||type==="house"||type==="room"){X.strokeStyle=col(c,.55);X.lineWidth=3;X.strokeRect(cx-r*.34,cy-r*.52,r*.68,r*.95);X.strokeStyle=col(c,.28);X.strokeRect(cx-r*.26,cy-r*.42,r*.52,r*.75);glow(cx,cy,r*.2,c,.18)}
 // stars and dust
 for(let q=0;q<25;q++){let a=R(depth*19+q)*Math.PI*2,dd=R(depth*31+q)*r;let sx=cx+Math.cos(a)*dd,sy=cy+Math.sin(a)*dd;X.fillStyle="rgba(255,255,255,"+(.12+R(q+depth)*.45)+")";X.beginPath();X.arc(sx,sy,Math.max(.5,1.5*s),0,7);X.fill()}
 // recurse: the centre of the scene is literally another world
 if(depth<7){
  X.save();X.globalCompositeOperation="source-over";
  let rr2=r*.30;
  X.fillStyle="rgba(2,1,7,.82)";X.beginPath();X.arc(cx,cy,rr2,0,7);X.fill();
  X.restore();
  scene((sceneData[depth+1]||sceneData[0])[0],(sceneData[depth+1]||sceneData[0])[1],depth+1,s*.34);
 }
}
const sceneData=scenes.map(q=>[q[1],q[2]]);
function draw(){
 if(!paused)z+=v;
 if(z>=50)z-=50;if(z<0)z+=50;
 let i=Math.floor(z),f=z-i;
 N.textContent="WORLD "+String(i+1).padStart(2,"0")+" — "+scenes[i][0];
 X.setTransform(D,0,0,D,0,0);X.fillStyle="#020107";X.fillRect(0,0,W,H);
 let bg=X.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);bg.addColorStop(0,col(scenes[i][2],.16));bg.addColorStop(1,"rgba(0,0,0,0)");X.fillStyle=bg;X.fillRect(0,0,W,H);
 // slightly scale the whole stage continuously so transition feels like flying
 let s=1+f*.08;
 scene(scenes[i][1],scenes[i][2],0,s);
 let vgr=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.72);vgr.addColorStop(0,"rgba(0,0,0,0)");vgr.addColorStop(1,"rgba(0,0,0,.7)");X.fillStyle=vgr;X.fillRect(0,0,W,H);
 requestAnimationFrame(draw);
}
function bind(id,fn){let b=document.getElementById(id);b.onclick=fn;b.ontouchend=e=>{e.preventDefault();fn()}}
bind("in",()=>{z=Math.min(49.999,z+1);v=0});bind("out",()=>{z=Math.max(0,z-1);v=0});bind("dive",()=>{v=Math.min(.045,v+.008)});bind("pause",()=>{paused=!paused;document.getElementById("pause").textContent=paused?"PLAY":"PAUSE"});
C.onpointerdown=e=>{drag=1;lx=e.clientX;ly=e.clientY};C.onpointermove=e=>{if(drag){px+=(e.clientX-lx)*.7;py+=(e.clientY-ly)*.7;lx=e.clientX;ly=e.clientY}};C.onpointerup=()=>drag=0;C.onpointercancel=()=>drag=0;
C.ontouchstart=e=>{if(e.touches.length===2){drag=0;pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}else{drag=1;lx=e.touches[0].clientX;ly=e.touches[0].clientY}};C.ontouchmove=e=>{e.preventDefault();if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)v+=(d-pinch)*.0008;pinch=d}else if(drag){px+=(e.touches[0].clientX-lx)*.7;py+=(e.touches[0].clientY-ly)*.7;lx=e.touches[0].clientX;ly=e.touches[0].clientY}};C.ontouchend=()=>{drag=0;pinch=0};
draw();
</script></body></html>
