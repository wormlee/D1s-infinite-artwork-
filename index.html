<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>INFINITE — Dream Descent</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020106;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
#art{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;z-index:100;left:16px;top:14px;pointer-events:none;text-shadow:0 2px 12px #000}
#title{font-size:12px;font-weight:900;letter-spacing:.18em}
#world{margin-top:5px;font-size:10px;letter-spacing:.07em;opacity:.65;max-width:70vw}
#hint{position:fixed;z-index:100;right:15px;top:14px;text-align:right;font-size:9px;letter-spacing:.08em;opacity:.45;pointer-events:none}
#controls{position:fixed;z-index:1000;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:7px;padding:0 10px;pointer-events:auto}
#controls button{pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:1px solid rgba(255,255,255,.28);background:rgba(8,5,18,.86);color:#fff;border-radius:999px;padding:13px 12px;min-width:72px;font-size:10px;font-weight:900;letter-spacing:.06em;box-shadow:0 5px 22px rgba(0,0,0,.4)}
#controls button:active{transform:scale(.94);background:rgba(255,255,255,.18)}
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="hud"><div id="title">INFINITE / DREAM DESCENT</div><div id="world"></div></div>
<div id="hint">DRAG TO EXPLORE<br>PINCH OR USE BUTTONS</div>

<div id="controls">
  <button id="zoomOut" type="button">− ZOOM</button>
  <button id="dive" type="button">DIVE ×10</button>
  <button id="surface" type="button">SURFACE</button>
  <button id="zoomIn" type="button">+ ZOOM</button>
</div>

<script>
(function(){
"use strict";
const canvas=document.getElementById("art");
const ctx=canvas.getContext("2d",{alpha:false});
const label=document.getElementById("world");
const names=[
"THE DOOR THAT REMEMBERS","SCHOOL OF STRANGE THINGS","THE EMPTY CLASSROOM","THE DESK WITH A HEART",
"LUNCH BECOMES A GALAXY","THE ROOM OF TOO MANY PLATES","THE MIRROR HALL","CRACK IN THE MIRROR",
"THE OTHER SIDE OF GLASS","FOREST OF WATCHING EYES","MUSHROOM CITY","THE LITTLE ELF PARTY",
"THE BANQUET UNDER THE ROOTS","THE RED MOON CARNIVAL","A HOUSE INSIDE A HOUSE","THE LIBRARY OF DREAMS",
"THE BOOK THAT READS YOU","STAIRCASE WITHOUT A FLOOR","THE OCEAN IN A BEDROOM","THE SKY UNDER THE SEA",
"THE CITY BENEATH THE SKIN","ONE THOUSAND WINDOWS","THE PEOPLE MADE OF STARS","THE CLOCK WITH NO TIME",
"THE GARDEN OF LOST THOUGHTS","THE GIANT EYE","THE EYE WITHIN THE EYE","THE UNIVERSE IN A TEARDROP",
"THE MOUNTAIN IS BREATHING","THE ROOM AT THE END","THE ROOM BEFORE THE BEGINNING","ALL THINGS ARE ONE",
"THE THREAD CONNECTS EVERYTHING","THE INFINITE DINNER TABLE","THE CHILD WHO FOUND THE DOOR",
"THE DOOR INSIDE THE DOOR","THE COSMIC CLASSROOM","THE MUSHROOM SUN","THE DREAMING CITY",
"THE CITY DREAMS OF YOU","THE MIRROR DREAMS OF THE CITY","THE CRACK BECOMES A RIVER",
"THE RIVER BECOMES A SKY","THE SKY BECOMES AN EYE","THE EYE BECOMES A WORLD","THE WORLD BECOMES A SEED",
"THE SEED CONTAINS EVERYTHING","LET GO","YOU ARE HERE","THE DOOR REMEMBERS"
];

let W=0,H=0,D=1,zoom=0,panX=0,panY=0,velocity=0,drag=false,lastX=0,lastY=0,pinch=0;

function resize(){
 W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);
 canvas.width=Math.floor(W*D);canvas.height=Math.floor(H*D);
 ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

function rnd(n){return (Math.sin(n*999.123)*43758.5453)%1}
function rr(n){return Math.abs(rnd(n))}
function star(px,py,r,a){
 ctx.globalAlpha=a;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
}
function portal(cx,cy,r,seed){
 for(let q=0;q<5;q++){
  ctx.beginPath();
  for(let i=0;i<=120;i++){
   const a=i/120*Math.PI*2;
   const wob=1+Math.sin(a*(5+q)+seed)*.028;
   const rx=cx+Math.cos(a)*r*(1-q*.11)*wob;
   const ry=cy+Math.sin(a)*r*(1-q*.11)*wob;
   if(i===0)ctx.moveTo(rx,ry);else ctx.lineTo(rx,ry);
  }
  ctx.strokeStyle="hsla("+(seed*41+q*34)%360+",85%,"+(55+q*6)+"%,"+(.22+q*.07)+")";
  ctx.lineWidth=1.5+q*.6;ctx.stroke();
 }
}
function motif(type,x,y,s){
 ctx.save();ctx.translate(x,y);
 ctx.lineWidth=Math.max(1,s*.025);
 if(type===0){
  ctx.fillStyle="rgba(35,25,55,.9)";ctx.fillRect(-s*.65,-s*.45,s*1.3,s*.9);
  ctx.strokeStyle="rgba(255,255,255,.28)";ctx.strokeRect(-s*.65,-s*.45,s*1.3,s*.9);
  for(let i=-2;i<=2;i++){ctx.fillStyle="rgba(255,255,255,.14)";ctx.fillRect(i*s*.21,-s*.18,s*.1,s*.27)}
 }else if(type===1){
  ctx.strokeStyle="rgba(255,220,190,.42)";ctx.beginPath();ctx.arc(0,0,s*.48,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,s*.25,0,7);ctx.stroke();
 }else if(type===2){
  ctx.strokeStyle="rgba(150,220,255,.48)";ctx.strokeRect(-s*.42,-s*.62,s*.84,s*1.24);
  ctx.beginPath();ctx.moveTo(-s*.34,-s*.45);ctx.lineTo(s*.31,s*.45);ctx.moveTo(s*.28,-s*.5);ctx.lineTo(-s*.3,s*.5);ctx.stroke();
 }else if(type===3){
  ctx.fillStyle="rgba(245,75,155,.72)";ctx.beginPath();ctx.arc(0,-s*.08,s*.4,Math.PI,0);ctx.fill();
  ctx.fillStyle="rgba(235,220,190,.8)";ctx.fillRect(-s*.08,-s*.06,s*.16,s*.42);
 }else if(type===4){
  ctx.strokeStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(0,0,s*.55,s*.3,0,0,7);ctx.stroke();
  ctx.fillStyle="rgba(220,90,255,.85)";ctx.beginPath();ctx.arc(0,0,s*.12,0,7);ctx.fill();
 }else if(type===5){
  for(let i=-1;i<=1;i++){ctx.fillStyle="rgba(110,255,185,.62)";ctx.beginPath();ctx.arc(i*s*.24,-s*.16,s*.075,0,7);ctx.fill();ctx.fillRect(i*s*.24-s*.04,-s*.08,s*.08,s*.25)}
 }else if(type===6){
  ctx.strokeStyle="rgba(255,190,90,.58)";ctx.strokeRect(-s*.5,-s*.32,s,s*.64);ctx.beginPath();ctx.moveTo(0,-s*.32);ctx.lineTo(0,s*.32);ctx.stroke();
 }else if(type===7){
  ctx.strokeStyle="rgba(255,255,255,.42)";ctx.beginPath();ctx.arc(0,0,s*.42,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*.2,-s*.2);ctx.moveTo(0,0);ctx.lineTo(-s*.06,s*.23);ctx.stroke();
 }else if(type===8){
  ctx.strokeStyle="rgba(90,255,180,.45)";ctx.beginPath();ctx.moveTo(0,s*.45);ctx.lineTo(0,-s*.15);ctx.moveTo(0,0);ctx.lineTo(-s*.24,-s*.25);ctx.moveTo(0,0);ctx.lineTo(s*.24,-s*.3);ctx.stroke();
 }else{
  ctx.strokeStyle="rgba(220,100,255,.62)";ctx.beginPath();ctx.moveTo(-s*.45,0);ctx.bezierCurveTo(-s*.15,-s*.45,s*.15,s*.45,s*.45,0);ctx.bezierCurveTo(s*.15,-s*.45,-s*.15,s*.45,-s*.45,0);ctx.stroke();
 }
 ctx.restore();
}

function world(index,depth,scale,cx,cy){
 if(depth>10||scale<.012)return;
 const seed=index*17+depth*71;
 const r=Math.min(W,H)*.46*scale;
 const hue=(index*29+depth*19)%360;

 const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(r,1));
 g.addColorStop(0,"hsla("+hue+",70%,18%,.42)");
 g.addColorStop(.55,"hsla("+((hue+80)%360)+",70%,10%,.15)");
 g.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();

 for(let k=0;k<30;k++){
  const a=rr(seed+k)*Math.PI*2;
  const d=(.12+rr(seed*3+k)*.82)*r;
  star(cx+Math.cos(a)*d,cy+Math.sin(a)*d,Math.max(.6,1.4*scale),.16+.28*rr(seed+k*5));
 }

 portal(cx,cy,r,seed);
 for(let k=0;k<9;k++){
  const a=k*Math.PI*2/9+seed*.013;
  const d=r*.77;
  motif((index+k+depth)%10,cx+Math.cos(a)*d,cy+Math.sin(a)*d,Math.max(16,r*.12));
 }

 // recurring hidden symbols
 if(depth<5){
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font="900 "+Math.max(8,r*.05)+"px system-ui";
  ctx.fillStyle="rgba(255,255,255,.17)";
  const words=["LET GO","LOOK CLOSER","ALL THINGS ARE ONE","YOU ARE HERE","WAKE UP"];
  ctx.fillText(words[(index+depth)%words.length],cx,cy-r*.72);ctx.restore();
 }

 const inner=r*.34;
 const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,inner*1.6);
 glow.addColorStop(0,"rgba(255,255,255,.18)");
 glow.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,inner*1.6,0,7);ctx.fill();

 if(depth<10)world((index+1)%50,depth+1,scale*.32,cx,cy);
}

function render(){
 velocity*=.90;
 zoom+=velocity;
 if(zoom<0){zoom=0;velocity=0}
 if(zoom>49.999){zoom=49.999;velocity=0}
 const idx=Math.floor(zoom)%50;
 label.textContent="WORLD "+String(idx+1).padStart(2,"0")+" — "+names[idx];

 ctx.setTransform(D,0,0,D,0,0);
 ctx.fillStyle="#020106";ctx.fillRect(0,0,W,H);
 const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
 bg.addColorStop(0,"#10071c");bg.addColorStop(.5,"#05030b");bg.addColorStop(1,"#010106");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 world(idx,0,1,W/2+panX,H/2+panY);

 const vign=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.22,W/2,H/2,Math.max(W,H)*.72);
 vign.addColorStop(0,"rgba(0,0,0,0)");vign.addColorStop(1,"rgba(0,0,0,.7)");
 ctx.fillStyle=vign;ctx.fillRect(0,0,W,H);
 requestAnimationFrame(render);
}
render();

function bind(id,fn){
 const el=document.getElementById(id);
 el.addEventListener("click",e=>{e.preventDefault();fn()});
 el.addEventListener("touchend",e=>{e.preventDefault();fn()},{passive:false});
}
bind("zoomIn",()=>{zoom=Math.min(49.999,zoom+1);velocity=0});
bind("zoomOut",()=>{zoom=Math.max(0,zoom-1);velocity=0});
bind("dive",()=>{velocity+=.025});
bind("surface",()=>{zoom=0;velocity=0;panX=0;panY=0});

canvas.addEventListener("pointerdown",e=>{
 drag=true;lastX=e.clientX;lastY=e.clientY;
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
});
canvas.addEventListener("pointermove",e=>{
 if(!drag)return;
 panX+=(e.clientX-lastX)*.7;panY+=(e.clientY-lastY)*.7;
 lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("pointercancel",()=>drag=false);

canvas.addEventListener("touchstart",e=>{
 if(e.touches.length===2){
  drag=false;
  pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
 }else if(e.touches.length===1){
  drag=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
 }
},{passive:false});

canvas.addEventListener("touchmove",e=>{
 e.preventDefault();
 if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  if(pinch)velocity+=(d-pinch)*.0008;
  pinch=d;
 }else if(e.touches.length===1&&drag){
  panX+=(e.touches[0].clientX-lastX)*.8;panY+=(e.touches[0].clientY-lastY)*.8;
  lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
 }
},{passive:false});
canvas.addEventListener("touchend",e=>{
 if(e.touches.length<2)pinch=0;
 if(e.touches.length===0)drag=false;
});
})();
</script>
</body>
</html>
