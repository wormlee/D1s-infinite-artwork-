html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030106;
  color:#fff;
  font-family:system-ui,sans-serif;
  touch-action:none;
}

#stage{
  position:fixed;
  inset:0;
  perspective:900px;
  overflow:hidden;
  background:#000;
}

#world{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  will-change:transform;
}

.scene{
  position:absolute;
  left:50%;
  top:50%;
  width:min(100vw,1000px);
  aspect-ratio:1000/700;

  transform:
    translate(-50%,-50%)
    translate3d(0,0,0)
    scale(1);

  transform-origin:center;
  transform-style:preserve-3d;
  backface-visibility:hidden;
  will-change:transform;
}

.scene svg{
  width:100%;
  height:100%;
  display:block;
  filter:saturate(1.15);
}

#hud{
  position:fixed;
  z-index:10;
  left:14px;
  right:14px;
  top:14px;

  display:flex;
  justify-content:space-between;

  pointer-events:none;
}

.badge{
  background:#0009;
  border:1px solid #fff3;
  border-radius:14px;

  padding:8px 11px;

  font-size:11px;
  letter-spacing:2px;

  backdrop-filter:blur(8px);
}

#hint{

}

#flash{

  inset:0;

  opacity:0;

  pointer-events:none;

<script>

/* =========================================================
   CORE
   ========================================================= */

const scenes = [
  document.getElementById('s0'),
  document.getElementById('s1')
];


const clamp = (v,a,b) =>
  Math.max(a,Math.min(b,v));


let depth = 0;

let targetDepth = 0;

let panX = 0;
let panY = 0;

let targetX = 0;
let targetY = 0;


/* =========================================================
   TOUCH STATE
   ========================================================= */

let touchMode = 'none';

let swipeLastX = 0;
let swipeLastY = 0;

let pinchStartDistance = 0;
let pinchFilteredDistance = 0;

let pinchStartDepth = 0;

let pinchDepthTarget = 0;


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const z = depth * 900;


  scenes.forEach((scene,index)=>{

    const dz =
      index * 900 - z;


    const scale =
      Math.max(
        .05,
        900 / (900 - dz)
      );


    const opacity =
      clamp(
        1 - Math.abs(dz) / 1600,
        .05,
        1
      );


    scene.style.transform =
      `translate(-50%,-50%)
       translate3d(
         ${panX * scale}px,
         ${panY * scale}px,
         ${dz}px
       )
       scale(${scale})`;


    scene.style.opacity = opacity;

  });


  document.getElementById('title').textContent =
    depth < .5
      ? 'WORLD 01 · HORROR'
      : 'WORLD 02 · PSYCHEDELIC';

}


/* =========================================================
   MAIN ANIMATION LOOP
   ========================================================= */

function frame(){

  /*
   * Smooth depth interpolation.
   *
   * This is deliberately slower than
   * the swipe interpolation.
   */

  depth +=
    (targetDepth - depth) * .085;


  /*
   * Swipe stays responsive.
   */

  panX +=
    (targetX - panX) * .12;

  panY +=
    (targetY - panY) * .12;


  render();


  requestAnimationFrame(frame);

}


/* =========================================================
   DIVE
   ========================================================= */

function dive(amount = .9){

  targetDepth =
    clamp(
      targetDepth + amount,
      0,
      1.08
    );

}


/* =========================================================
   FLASH
   ========================================================= */

function flash(){

  const element =
    document.getElementById('flash');


  element.style.opacity = .7;


  setTimeout(()=>{

    element.style.opacity = 0;

  },180);

}


/* =========================================================
   ONE-FINGER SWIPE
   ========================================================= */

document.addEventListener(
  'touchstart',
  e => {

    /*
     * TWO FINGERS = PINCH
     */

    if(e.touches.length === 2){

      touchMode = 'pinch';


      pinchStartDistance =
        getPinchDistance(e);


      pinchFilteredDistance =
        pinchStartDistance;


      pinchStartDepth =
        targetDepth;


      pinchDepthTarget =
        targetDepth;


      return;

    }


    /*
     * ONE FINGER = SWIPE
     */

    if(e.touches.length === 1){

      touchMode = 'swipe';


      swipeLastX =
        e.touches[0].clientX;


      swipeLastY =
        e.touches[0].clientY;

    }

  },
  {passive:false}
);


/* =========================================================
   TOUCH MOVE
   ========================================================= */

document.addEventListener(
  'touchmove',
  e => {

    e.preventDefault();


    /* -----------------------------------------------------
       PINCH
       ----------------------------------------------------- */

    if(
      touchMode === 'pinch' &&
      e.touches.length === 2
    ){

      const rawDistance =
        getPinchDistance(e);


      /*
       * LOW-PASS FILTER
       *
       * Only 12% of the new measurement
       * is accepted per event.
       */

      pinchFilteredDistance +=
        (
          rawDistance -
          pinchFilteredDistance
        ) * .12;


      /*
       * Difference from where the pinch
       * originally started.
       */

      const delta =
        pinchFilteredDistance -
        pinchStartDistance;


      /*
       * Convert finger distance into
       * depth movement.
       *
       * 1200 = sensitivity divisor.
       */

      const desiredDepth =
        clamp(
          pinchStartDepth -
          delta / 1200,
          0,
          1.08
        );


      /*
       * Smoothly move the pinch target
       * toward the desired position.
       */

      pinchDepthTarget +=
        (
          desiredDepth -
          pinchDepthTarget
        ) * .10;


      /*
       * Tiny movements are ignored.
       */

      const difference =
        pinchDepthTarget -
        targetDepth;


      if(
        Math.abs(difference) > .001
      ){

        /*
         * Per-event movement cap.
         *
         * Prevents sudden jumps.
         */

        const step =
          clamp(
            difference * .15,
            -.010,
            .010
          );


        targetDepth =
          clamp(
            targetDepth + step,
            0,
            1.08
          );

      }


      return;

    }


    /* -----------------------------------------------------
       ONE-FINGER SWIPE
       ----------------------------------------------------- */

    if(
      touchMode === 'swipe' &&
      e.touches.length === 1
    ){

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;


      const dx =
        x - swipeLastX;

      const dy =
        y - swipeLastY;


      swipeLastX = x;
      swipeLastY = y;


      /*
       * Same smooth swipe behaviour.
       */

      targetX =
        clamp(
          targetX + dx * 1.3,
          -240,
          240
        );


      targetY =
        clamp(
          targetY + dy * 1.3,
          -180,
          180
        );

    }

  },
  {passive:false}
);


/* =========================================================
   TOUCH END
   ========================================================= */

document.addEventListener(
  'touchend',
  e => {

    /*
     * If fewer than two fingers remain,
     * pinch mode is finished.
     */

    if(e.touches.length < 2){

      touchMode = 'none';

    }

  },
  {passive:false}
);


/* =========================================================
   TOUCH CANCEL
   ========================================================= */

document.addEventListener(
  'touchcancel',
  () => {

    touchMode = 'none';

  },
  {passive:false}
);


/* =========================================================
   PINCH DISTANCE
   ========================================================= */

function getPinchDistance(e){

  return Math.hypot(

    e.touches[0].clientX -
    e.touches[1].clientX,

    e.touches[0].clientY -
    e.touches[1].clientY

  );

}


/* =========================================================
   MOUSE / TRACKPAD
   ========================================================= */

document.addEventListener(
  'wheel',
  e => {

    e.preventDefault();


    dive(
      e.deltaY > 0
        ? .035
        : -.035
    );

  },
  {passive:false}
);


/* =========================================================
   PORTALS
   ========================================================= */

document
  .querySelectorAll('.portal')
  .forEach(portal => {

    portal.addEventListener(
      'pointerup',
      e => {

        e.stopPropagation();


        flash();


        /*
         * Enter the next world.
         */

        targetDepth =
          clamp(
            targetDepth + .75,
            0,
            1.08
          );

      }
    );

  });


/* =========================================================
   HINT
   ========================================================= */

setTimeout(
  () => {

    document.getElementById(
      'hint'
    ).style.opacity = .25;

  },
  5000
);


/* =========================================================
   START
   ========================================================= */

render();

frame();

</script>
